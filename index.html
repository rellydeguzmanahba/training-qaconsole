<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>AHBA QA &amp; Training Management</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/employees.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/theme.css?v=20261029d">
  <link rel="stylesheet" href="css/portal.css?v=20261029d">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script type="module" src="js/app.js?v=20261029d"></script>
</head>
<body>
  <div id="boot" class="boot" role="status">Loading…</div>
  <div id="auth-root" class="auth-root" hidden></div>

  <div id="app" class="app" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Main navigation">
      <div class="sidebar__brand">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span class="brand-text">AHBA<small>QA &amp; Training</small></span>
      </div>
      <nav id="nav" class="sidebar__nav"></nav>
      <button id="collapse" class="sidebar__collapse" type="button" aria-label="Collapse sidebar"></button>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <div class="main">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn mobile-only" type="button" aria-label="Open menu"></button>
        <h1 id="page-title" class="topbar__title"></h1>
        <div class="topbar__right">
          <span id="user-name" class="user-name"></span>
          <span id="user-role" class="badge badge--green"></span>
          <button id="signout" class="icon-btn" type="button" aria-label="Sign out" title="Sign out"></button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
